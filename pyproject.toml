[project]
name = "howchat"
version = "1.0.5"
description = "离线去中心化端到端加密即时通讯工具（局域网 / 蓝牙，中继跳转）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=3.0.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
bluetooth = ["pybluez; sys_platform != 'win32'", "pybluez2; sys_platform == 'win32'"]
dev = ["pytest"]

[project.scripts]
howchat = "howchat.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["howchat", "howchat.transport", "howchat.tui"]